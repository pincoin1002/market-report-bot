name: Portfolio Event Smoke
# attempt: bounded-fallback-v3

on:
  push:
    paths:
      - ".github/workflows/portfolio-event-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIOS_PORTFOLIO_SNAPSHOT_JSON: ${{ secrets.PIOS_PORTFOLIO_SNAPSHOT_JSON }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PORTFOLIO_KEY: ${{ secrets.PORTFOLIO_KEY }}
      REPORT_MODEL: ${{ vars.REPORT_MODEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run private event monitor smoke
        env:
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import json
          import os
          import tempfile
          from collections import Counter
          from pathlib import Path

          from portfolio_context import load_authoritative_portfolio
          from portfolio_events import fetch_portfolio_events

          portfolio = load_authoritative_portfolio()
          total = len(portfolio.positions)
          if total <= 0:
              raise SystemExit("No authoritative private portfolio positions available")

          with tempfile.TemporaryDirectory() as td:
              cache_path = Path(td) / "portfolio_event_cache.json.enc"
              facts, upcoming = fetch_portfolio_events(
                  portfolio=portfolio,
                  model=(os.getenv("REPORT_MODEL") or "gemini-2.0-flash").strip(),
                  force_refresh_tickers={p.ticker.upper() for p in portfolio.positions},
                  cache_path=cache_path,
              )

          statuses = Counter(f.event_status for f in facts)
          instrument_ids = {f.instrument_id for f in facts}
          checked_ids = {
              f.instrument_id for f in facts
              if f.event_status in ("EVENT_CHECKED_NO_MATERIAL_CHANGE", "EVENT_MATERIAL_FOUND")
          }
          failed_ids = {f.instrument_id for f in facts if f.event_status == "EVENT_CHECK_FAILED"}
          material_ids = {f.instrument_id for f in facts if f.event_status == "EVENT_MATERIAL_FOUND"}

          # Aggregate-only output: never print tickers, names, quantities, URLs, or event text.
          print(json.dumps({
              "portfolio_positions": total,
              "event_fact_instruments": len(instrument_ids),
              "event_checked_instruments": len(checked_ids),
              "event_failed_instruments": len(failed_ids),
              "material_event_instruments": len(material_ids),
              "upcoming_event_count": len(upcoming),
              "status_counts": dict(statuses),
          }, sort_keys=True))

          if len(instrument_ids) != total:
              raise SystemExit("Event fact coverage does not match portfolio position count")
          if failed_ids:
              raise SystemExit("One or more production event checks failed closed")
          if len(checked_ids) != total:
              raise SystemExit("Production event coverage is incomplete")
          PY
