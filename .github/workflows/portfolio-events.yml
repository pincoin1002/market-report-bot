name: Portfolio Event Refresh

on:
  schedule:
    # Every 6 hours. With a 12-hour TTL, every second successful run refreshes.
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: portfolio-event-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIOS_PORTFOLIO_SNAPSHOT_JSON: ${{ secrets.PIOS_PORTFOLIO_SNAPSHOT_JSON }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PORTFOLIO_KEY: ${{ secrets.PORTFOLIO_KEY }}
      REPORT_MODEL: ${{ vars.REPORT_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh private portfolio event cache
        env:
          PYTHONPATH: scripts
        run: python scripts/refresh_portfolio_events.py

      - name: Persist encrypted event cache
        if: always()
        run: |
          if [ ! -f portfolio_event_cache.json.enc ]; then
            echo "No encrypted event cache produced."
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio_event_cache.json.enc
          if git diff --cached --quiet; then
            echo "Encrypted event cache unchanged."
            exit 0
          fi
          git commit -m "chore: refresh encrypted portfolio event cache [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
