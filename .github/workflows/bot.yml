name: Telegram Q&A Bot

on:
  workflow_dispatch:
  schedule:
    # Backup heartbeat: keeps the bot alive if the external per-minute
    # dispatcher ever dies. Concurrency below dedupes overlapping runs.
    - cron: "*/5 * * * *"

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  run-bot:
    name: Poll Telegram and answer questions
    runs-on: ubuntu-latest
    timeout-minutes: 8

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-bot.txt

      - name: Install dependencies (bot-only, fast)
        run: pip install -r requirements-bot.txt

      - name: Run Telegram bot (240s polling)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Decrypts portfolio.json.enc in-repo; plaintext never exists in CI
          PORTFOLIO_KEY: ${{ secrets.PORTFOLIO_KEY }}
          REPORT_MODEL: ${{ vars.REPORT_MODEL }}
        run: python scripts/telegram_bot.py --duration 240

      - name: Commit and push bot state
        # State commit must survive races with report workflows pushing
        # concurrently — retry the rebase+push a few times.
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bot_state.json data/reports.db
          git add portfolio.json.enc 2>/dev/null || true
          git commit -m "chore: update telegram bot state [skip ci]" || exit 0
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            echo "push attempt $i failed — retrying"
            sleep 5
          done
          echo "::warning::bot state push failed after 3 attempts (offset is confirmed server-side; next run self-heals)"
