name: Telegram Q&A Bot

on:
  workflow_dispatch:

concurrency:
  group: telegram-bot
  cancel-in-progress: true

jobs:
  run-bot:
    name: Poll Telegram and answer questions
    runs-on: ubuntu-latest
    timeout-minutes: 6
    continue-on-error: true

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Materialize portfolio from secret
        env:
          PORTFOLIO_JSON: ${{ secrets.PORTFOLIO_JSON }}
        run: |
          if [ -n "$PORTFOLIO_JSON" ]; then
            printf '%s' "$PORTFOLIO_JSON" > portfolio.json
            echo "portfolio.json materialized"
          else
            echo "PORTFOLIO_JSON secret not set — running without portfolio context"
          fi

      - name: Run Telegram bot (270s polling)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_MODEL: ${{ vars.REPORT_MODEL }}
        run: python scripts/telegram_bot.py --duration 270

      - name: Commit and push bot state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bot_state.json data/reports.db
          git commit -m "chore: update telegram bot state [skip ci]" || exit 0
          git pull --rebase
          git push
