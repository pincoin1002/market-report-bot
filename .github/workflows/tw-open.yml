name: 台股開盤戰報

on:
  schedule:
    # 台北時間 06:50（週一～週五）= UTC 22:50（前一天週日～週四）（提早以防 GitHub 排程延遲）
    - cron: "50 22 * * 0-4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (generate report but skip notifications)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  generate-report:
    name: Generate Taiwan Open Report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Taiwan Open Report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          REPORT_MODEL: ${{ vars.REPORT_MODEL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "=== DRY RUN: notifications disabled ==="
            TELEGRAM_BOT_TOKEN="" EMAIL_SMTP_SERVER="" python scripts/generate_report.py tw_open
          else
            python scripts/generate_report.py tw_open
          fi

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tw-open-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/tw_open_*.md
          retention-days: 90
          if-no-files-found: warn

  retry-on-failure:
    name: Retry Taiwan Open Report (on failure)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: generate-report
    if: ${{ needs.generate-report.result == 'failure' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait before retry
        run: sleep 60

      - name: Generate Taiwan Open Report (retry)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          REPORT_MODEL: ${{ vars.REPORT_MODEL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "=== DRY RUN: notifications disabled ==="
            TELEGRAM_BOT_TOKEN="" EMAIL_SMTP_SERVER="" python scripts/generate_report.py tw_open
          else
            python scripts/generate_report.py tw_open
          fi

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tw-open-retry-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/tw_open_*.md
          retention-days: 90
          if-no-files-found: warn
