name: 台股開盤戰報

on:
  schedule:
    # 台北時間 07:50（週一～週五）= UTC 23:50（前一天週日～週四）
    - cron: "50 23 * * 0-4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (generate report but skip notifications)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  generate-report:
    name: Generate Taiwan Open Report
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch market snapshot
        id: fetch
        continue-on-error: true
        run: |
          mkdir -p data
          python scripts/fetch_market_data.py tw_open
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 2 ]; then
            echo "market_closed=true" >> $GITHUB_OUTPUT
          else
            echo "market_closed=false" >> $GITHUB_OUTPUT
          fi
          exit 0

      - name: Generate Taiwan Open Report
        if: steps.fetch.outputs.market_closed != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          REPORT_MODEL: ${{ vars.REPORT_MODEL }}
          # Set empty strings to skip notifications on dry run
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "=== DRY RUN: notifications disabled ==="
            TELEGRAM_BOT_TOKEN="" EMAIL_SMTP_SERVER="" python scripts/generate_report.py tw_open
          else
            python scripts/generate_report.py tw_open
          fi

      - name: Skip report (market closed)
        if: steps.fetch.outputs.market_closed == 'true'
        run: echo "Market closed today — report generation skipped."

      - name: Validate report prices
        if: steps.fetch.outputs.market_closed != 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPORT_MODEL: ${{ vars.REPORT_MODEL }}
        run: python scripts/validate_report.py tw_open

      - name: Prepare review package
        if: steps.fetch.outputs.market_closed != 'true'
        continue-on-error: true
        run: python scripts/prepare_review.py tw_open

      - name: Upload review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tw-open-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/review_package_*.md
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tw-open-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/tw_open_*.md
          retention-days: 90
          if-no-files-found: warn

      - name: Upload data artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tw-open-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/market_snapshot.json
            data/report_summary.json
            data/validation_results.json
          retention-days: 30
          if-no-files-found: ignore
