name: 美股開盤日報

on:
  schedule:
    # 夏令時間（EDT，3月第二個週日 ~ 11月第一個週日）
    # 台北時間 21:00（週一～週五）= UTC 13:00
    - cron: "0 13 * * 1-5"
    #
    # 冬令時間（EST，11月第一個週日 ~ 3月第二個週日）
    # 台北時間 21:00 = UTC 14:00，請改為：
    # - cron: "0 14 * * 1-5"
    #
    # 夏令/冬令切換方法：
    # 夏令（3月第二個週日起）→ cron: "0 13 * * 1-5"
    # 冬令（11月第一個週日起）→ cron: "0 14 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (generate report but skip notifications)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  generate-report:
    name: Generate US Open Report
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch market snapshot
        id: fetch
        continue-on-error: true
        run: |
          mkdir -p data
          python scripts/fetch_market_data.py us_open
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 3 ]; then
            echo "market_closed=true" >> $GITHUB_OUTPUT
          else
            echo "market_closed=false" >> $GITHUB_OUTPUT
          fi
          exit 0

      - name: Generate US Open Report
        if: steps.fetch.outputs.market_closed != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          REPORT_MODEL: ${{ vars.REPORT_MODEL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "=== DRY RUN: notifications disabled ==="
            TELEGRAM_BOT_TOKEN="" EMAIL_SMTP_SERVER="" python scripts/generate_report.py us_open
          else
            python scripts/generate_report.py us_open
          fi

      - name: Send non-trading day notice
        if: steps.fetch.outputs.market_closed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python - <<'EOF'
          import os, smtplib, requests
          from datetime import datetime, timezone, timedelta
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText

          ET = timezone(timedelta(hours=-5))
          today = datetime.now(tz=ET).strftime("%Y-%m-%d")
          msg_text = f"🔴 美股開盤日報｜{today}\n{'─'*38}\n\n今天為美股非交易日（假日或週末），市場休市，無開盤報告。"

          token = os.getenv("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.getenv("TELEGRAM_CHAT_ID", "").strip()
          if token and chat_id:
              requests.post(f"https://api.telegram.org/bot{token}/sendMessage",
                            json={"chat_id": chat_id, "text": msg_text}, timeout=30)
              print("[notice] Telegram sent")

          smtp = os.getenv("EMAIL_SMTP_SERVER", "").strip()
          user = os.getenv("EMAIL_USERNAME", "").strip()
          pwd  = os.getenv("EMAIL_PASSWORD", "").strip()
          to   = os.getenv("EMAIL_TO", "").strip()
          if smtp and user and pwd and to:
              recipients = [e.strip() for e in to.split(",") if e.strip()]
              m = MIMEMultipart("alternative")
              m["Subject"] = f"【市場報告】美股開盤日報 {today} — 今天非交易日"
              m["From"] = user
              m["To"] = ", ".join(recipients)
              m.attach(MIMEText(msg_text, "plain", "utf-8"))
              with smtplib.SMTP(smtp, int(os.getenv("EMAIL_SMTP_PORT","587")), timeout=30) as s:
                  s.ehlo(); s.starttls(); s.login(user, pwd)
                  s.sendmail(user, recipients, m.as_string())
              print("[notice] Email sent")
          EOF

      - name: Validate report prices
        if: steps.fetch.outputs.market_closed != 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPORT_MODEL: ${{ vars.REPORT_MODEL }}
        run: python scripts/validate_report.py us_open

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-open-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/us_open_*.md
          retention-days: 90
          if-no-files-found: warn

      - name: Upload data artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-open-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/market_snapshot.json
            data/report_summary.json
            data/validation_results.json
          retention-days: 30
          if-no-files-found: ignore
