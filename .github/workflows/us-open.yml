name: 美股開盤日報

on:
  schedule:
    # Native backup is intentionally staged hours before 09:05 New York.
    # Recent GitHub schedule events arrived 4-6 hours late; starting at 00:17
    # gives the workflow enough slack while preserving the canonical 09:05 snapshot.
    - cron: "17 0 * * 1-5"
      timezone: "America/New_York"
  repository_dispatch:
    types: [trigger-us-open]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Exercise production path without external sends or report commits"
        required: false
        default: false
        type: boolean
      send_telegram:
        description: "Deliver report to production Telegram (default: false)"
        required: false
        default: false
        type: boolean
      debug:
        description: "Enable debug logging (default: false)"
        required: false
        default: false
        type: boolean
      safe_verify:
        description: "Verify Telegram configuration and deterministic pipeline without sending a report"
        required: false
        default: false
        type: boolean
      scheduler_delivery_test:
        description: "Send exactly one labelled scheduler delivery test, never a market report"
        required: false
        default: false
        type: boolean
      intended_market_date:
        description: "Canonical NYSE date for an external scheduler trigger (YYYY-MM-DD)"
        required: false
        type: string
      intended_market_time:
        description: "Canonical NY time for an external scheduler trigger (must be 09:05)"
        required: false
        type: string
      trigger_source:
        description: "Operational provenance (for example: vercel_cron)"
        required: false
        type: string
      scheduler_triggered_at:
        description: "External scheduler UTC timestamp for latency telemetry"
        required: false
        type: string
      scheduler_terminal_state:
        description: "External scheduler terminal state; never generates a market report"
        required: false
        type: string


jobs:
  native-stage:
    name: Stage native US Open backup
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - name: Hold native backup until 04:30 New York
        run: |
          python - <<'PY'
          import time
          from datetime import datetime
          from zoneinfo import ZoneInfo

          ny = ZoneInfo("America/New_York")
          now = datetime.now(tz=ny)
          target = now.replace(hour=4, minute=30, second=0, microsecond=0)
          seconds = max(0, int((target - now).total_seconds()))
          if seconds:
              print(f"Native US-open backup staged early; waiting {seconds}s until 04:30 New York")
              time.sleep(seconds)
          else:
              print("Native US-open backup arrived after 04:30 New York; handing off immediately")
          PY

  generate-report:
    name: Generate US Open Report
    needs: [native-stage]
    if: always() && (github.event_name != 'schedule' || needs.native-stage.result == 'success')
    runs-on: ubuntu-latest
    # One mutable daily report and delivery state means concurrent external,
    # native-backup, and manual triggers must never run side-by-side.
    concurrency:
      group: us-open-canonical-delivery
      cancel-in-progress: false
    env:
      PIOS_PORTFOLIO_SNAPSHOT_JSON: ${{ secrets.PIOS_PORTFOLIO_SNAPSHOT_JSON }}
      US_OPEN_INTENDED_MARKET_DATE: ${{ github.event.inputs.intended_market_date || github.event.client_payload.intended_market_date || '' }}
      US_OPEN_INTENDED_TIME: ${{ github.event.inputs.intended_market_time || github.event.client_payload.intended_market_time || '09:05' }}
      US_OPEN_TRIGGER_SOURCE: ${{ github.event.inputs.trigger_source || github.event.client_payload.trigger_source || github.event_name }}
      US_OPEN_SCHEDULER_TRIGGERED_AT: ${{ github.event.inputs.scheduler_triggered_at || github.event.client_payload.scheduler_triggered_at || '' }}
      US_OPEN_SCHEDULER_TERMINAL_STATE: ${{ github.event.inputs.scheduler_terminal_state || github.event.client_payload.scheduler_terminal_state || '' }}
    timeout-minutes: 330
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Record expired external scheduler window
        if: github.event.inputs.scheduler_terminal_state == 'SCHEDULER_WINDOW_EXPIRED'
        run: python scripts/us_open_run_status.py SCHEDULER_WINDOW_EXPIRED "external scheduler invoked outside 08:00-08:59 New York staging window"

      - name: Send expired scheduler operational alert
        if: github.event.inputs.dry_run != 'true' && github.event.inputs.scheduler_terminal_state == 'SCHEDULER_WINDOW_EXPIRED'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/send_operational_alert.py us_open SCHEDULER_WINDOW_EXPIRED
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/.alerts/ 2>/dev/null || true
          git commit -m "chore: record us_open operational alert [skip ci]" || exit 0
          git pull --rebase
          git push || true

      - name: Fail expired scheduler window
        if: github.event.inputs.scheduler_terminal_state == 'SCHEDULER_WINDOW_EXPIRED'
        run: exit 1

      - name: Resolve canonical US Open intent and idempotency
        id: intent
        if: (github.event_name != 'workflow_dispatch' || (github.event.inputs.safe_verify != 'true' && github.event.inputs.scheduler_delivery_test != 'true')) && github.event.inputs.scheduler_terminal_state != 'SCHEDULER_WINDOW_EXPIRED'
        run: python scripts/us_open_intent.py

      - name: Verify Telegram configuration safely
        if: github.event_name == 'workflow_dispatch' && (github.event.inputs.safe_verify == 'true' || github.event.inputs.scheduler_delivery_test == 'true')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
          if not token or not chat_id:
              raise SystemExit("Telegram configuration missing")
          response = requests.get(f"https://api.telegram.org/bot{token}/getMe", timeout=20)
          response.raise_for_status()
          if not response.json().get("ok"):
              raise SystemExit("Telegram credential verification failed")
          print("Telegram credentials verified; no message sent")
          PY

      - name: Run deterministic delivery plumbing verification
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.safe_verify == 'true'
        run: python scripts/dry_run_v2.py

      - name: Send controlled scheduler delivery test
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.scheduler_delivery_test == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          response = requests.post(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
              json={"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": "US Open scheduler delivery test"},
              timeout=30,
          )
          response.raise_for_status()
          if not response.json().get("ok"):
              raise SystemExit("Telegram scheduler delivery test failed")
          print("Controlled scheduler delivery test sent")
          PY

      - name: Wait for canonical US Open snapshot time
        if: github.event.inputs.dry_run != 'true' && (github.event_name != 'workflow_dispatch' || (github.event.inputs.safe_verify != 'true' && github.event.inputs.scheduler_delivery_test != 'true')) && steps.intent.outputs.already_reported != 'true'
        run: python scripts/us_open_wait.py

      - name: Fetch market snapshot
        id: fetch
        if: (github.event_name != 'workflow_dispatch' || (github.event.inputs.safe_verify != 'true' && github.event.inputs.scheduler_delivery_test != 'true')) && steps.intent.outputs.already_reported != 'true'
        run: |
          mkdir -p data
          # set +e: the runner shell is bash -e, so a non-zero exit would kill
          # the step before EXIT_CODE=$? runs and holiday exits (2/3) would fail the job
          set +e
          python scripts/fetch_market_data.py us_open
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -eq 5 ]; then
            echo "intent_unavailable=true" >> $GITHUB_OUTPUT
            echo "terminal_state=INTENT_EXPIRED" >> $GITHUB_OUTPUT
            exit 0
          elif [ $EXIT_CODE -eq 7 ]; then
            echo "intent_unavailable=true" >> $GITHUB_OUTPUT
            echo "terminal_state=INTENT_PENDING" >> $GITHUB_OUTPUT
            exit 0
          elif [ $EXIT_CODE -eq 3 ]; then
            echo "market_closed=true" >> $GITHUB_OUTPUT
            echo "terminal_state=MARKET_CLOSED" >> $GITHUB_OUTPUT
            exit 0
          elif [ $EXIT_CODE -eq 0 ]; then
            echo "market_closed=false" >> $GITHUB_OUTPUT
            echo "intent_unavailable=false" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Error: fetch_market_data.py failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi

      - name: Record US Open unavailable terminal state
        if: always() && (steps.fetch.outputs.terminal_state == 'INTENT_EXPIRED' || steps.fetch.outputs.terminal_state == 'MARKET_CLOSED')
        run: python scripts/us_open_run_status.py "${{ steps.fetch.outputs.terminal_state }}"

      - name: Send US Open operational alert
        if: always() && github.event.inputs.dry_run != 'true' && steps.fetch.outputs.terminal_state == 'INTENT_EXPIRED'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/send_operational_alert.py us_open INTENT_EXPIRED
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/.alerts/ 2>/dev/null || true
          git commit -m "chore: record us_open operational alert [skip ci]" || exit 0
          git pull --rebase
          git push || true

      - name: Fail unavailable US Open intent
        if: always() && (steps.fetch.outputs.terminal_state == 'INTENT_EXPIRED' || steps.fetch.outputs.terminal_state == 'INTENT_PENDING')
        run: exit 1

      - name: Generate US Open Report
        id: generate
        if: (github.event_name != 'workflow_dispatch' || (github.event.inputs.safe_verify != 'true' && github.event.inputs.scheduler_delivery_test != 'true')) && steps.intent.outputs.already_reported != 'true' && steps.fetch.outputs.market_closed != 'true' && steps.fetch.outputs.intent_unavailable != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PORTFOLIO_KEY: ${{ secrets.PORTFOLIO_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_MODEL: ${{ vars.REPORT_MODEL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set +e
          if [ "$DRY_RUN" = "true" ]; then
            echo "=== DRY RUN: notifications disabled ==="
            python scripts/generate_report.py us_open --generate-only
          else
            python scripts/generate_report.py us_open --generate-only
          fi
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "terminal_state=VALIDATION_BLOCKED" >> $GITHUB_OUTPUT
            exit 0
          fi

      - name: Send non-trading day notice
        if: github.event.inputs.dry_run != 'true' && (github.event_name != 'workflow_dispatch' || (github.event.inputs.safe_verify != 'true' && github.event.inputs.scheduler_delivery_test != 'true')) && steps.fetch.outputs.market_closed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'EOF'
          import os, requests
          from datetime import datetime
          from zoneinfo import ZoneInfo

          today = datetime.now(tz=ZoneInfo("America/New_York")).strftime("%Y-%m-%d")
          msg_text = f"🔴 美股開盤日報｜{today}\n{'─'*38}\n\n今天為美股非交易日（假日或週末），市場休市，無開盤報告。"

          token = os.getenv("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.getenv("TELEGRAM_CHAT_ID", "").strip()
          if token and chat_id:
              requests.post(f"https://api.telegram.org/bot{token}/sendMessage",
                            json={"chat_id": chat_id, "text": msg_text}, timeout=30)
              print("[notice] Telegram sent")
          EOF

      - name: Validate report prices
        id: validate
        if: (github.event_name != 'workflow_dispatch' || (github.event.inputs.safe_verify != 'true' && github.event.inputs.scheduler_delivery_test != 'true')) && steps.intent.outputs.already_reported != 'true' && steps.fetch.outputs.market_closed != 'true' && steps.fetch.outputs.intent_unavailable != 'true' && steps.generate.outputs.terminal_state != 'VALIDATION_BLOCKED'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPORT_MODEL: ${{ vars.REPORT_MODEL }}
        run: |
          set +e
          python scripts/validate_report.py us_open
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "terminal_state=VALIDATION_BLOCKED" >> $GITHUB_OUTPUT
            exit 0
          fi

      - name: Deliver validated US Open Report
        id: deliver
        if: (github.event_name != 'workflow_dispatch' || (github.event.inputs.safe_verify != 'true' && github.event.inputs.scheduler_delivery_test != 'true')) && steps.intent.outputs.already_reported != 'true' && steps.fetch.outputs.market_closed != 'true' && steps.fetch.outputs.intent_unavailable != 'true' && steps.generate.outputs.terminal_state != 'VALIDATION_BLOCKED' && steps.validate.outputs.terminal_state != 'VALIDATION_BLOCKED' && (github.event.inputs.dry_run == 'true' || github.event_name == 'schedule' || inputs.send_telegram == true || github.event.inputs.send_telegram == 'true')
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PORTFOLIO_KEY: ${{ secrets.PORTFOLIO_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_MODEL: ${{ vars.REPORT_MODEL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set +e
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/generate_report.py us_open --deliver-existing --dry-run
          else
            python scripts/generate_report.py us_open --deliver-existing
          fi
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "terminal_state=DELIVERY_FAILED" >> $GITHUB_OUTPUT
          else
            echo "terminal_state=DELIVERED" >> $GITHUB_OUTPUT
          fi

      - name: Record validation or delivery terminal state
        if: always() && (steps.generate.outputs.terminal_state == 'VALIDATION_BLOCKED' || steps.validate.outputs.terminal_state == 'VALIDATION_BLOCKED' || steps.deliver.outputs.terminal_state == 'DELIVERED' || steps.deliver.outputs.terminal_state == 'DELIVERY_FAILED')
        run: |
          STATE="${{ steps.generate.outputs.terminal_state || steps.validate.outputs.terminal_state || steps.deliver.outputs.terminal_state }}"
          python scripts/us_open_run_status.py "$STATE"

      - name: Send validation or delivery operational alert
        if: always() && github.event.inputs.dry_run != 'true' && (steps.generate.outputs.terminal_state == 'VALIDATION_BLOCKED' || steps.validate.outputs.terminal_state == 'VALIDATION_BLOCKED' || steps.deliver.outputs.terminal_state == 'DELIVERY_FAILED')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATE="${{ steps.generate.outputs.terminal_state || steps.validate.outputs.terminal_state || steps.deliver.outputs.terminal_state }}"
          python scripts/send_operational_alert.py us_open "$STATE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/.alerts/ 2>/dev/null || true
          git commit -m "chore: record us_open operational alert [skip ci]" || exit 0
          git pull --rebase
          git push || true

      - name: Fail blocked validation or failed delivery
        if: always() && (steps.generate.outputs.terminal_state == 'VALIDATION_BLOCKED' || steps.validate.outputs.terminal_state == 'VALIDATION_BLOCKED' || steps.deliver.outputs.terminal_state == 'DELIVERY_FAILED')
        run: exit 1


      - name: Prepare review package
        if: (github.event_name != 'workflow_dispatch' || (github.event.inputs.safe_verify != 'true' && github.event.inputs.scheduler_delivery_test != 'true')) && steps.intent.outputs.already_reported != 'true' && steps.fetch.outputs.market_closed != 'true' && steps.fetch.outputs.intent_unavailable != 'true' && steps.generate.outputs.terminal_state != 'VALIDATION_BLOCKED' && steps.validate.outputs.terminal_state != 'VALIDATION_BLOCKED'
        continue-on-error: true
        run: python scripts/prepare_review.py us_open

      - name: Commit and push generated report
        if: github.event.inputs.dry_run != 'true' && (github.event_name != 'workflow_dispatch' || (github.event.inputs.safe_verify != 'true' && github.event.inputs.scheduler_delivery_test != 'true')) && steps.intent.outputs.already_reported != 'true' && steps.fetch.outputs.market_closed != 'true' && steps.fetch.outputs.intent_unavailable != 'true' && steps.generate.outputs.terminal_state != 'VALIDATION_BLOCKED' && steps.validate.outputs.terminal_state != 'VALIDATION_BLOCKED' && steps.deliver.outputs.terminal_state != 'DELIVERY_FAILED'
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if [ -f portfolio_event_cache.json.enc ]; then git add portfolio_event_cache.json.enc; fi
          git commit -m "chore: save generated us_open report [skip ci]" || exit 0
          git pull --rebase
          git push

      - name: Upload review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-open-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/review_package_*.md
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-open-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/us_open_*.md
          retention-days: 90
          if-no-files-found: warn

      - name: Upload data artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-open-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/market_snapshot.json
            data/market_context.json
            data/market_report_draft.json
            data/report_summary.json
            data/validation_results.json
            data/portfolio_advice_audit.json
            data/portfolio_decision_brief.json.enc
            data/delivery_state.json
            data/report_result.json
            data/us_open_run_status.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Report terminal result
        if: always()
        run: python scripts/print_report_result.py us_open "${{ steps.fetch.outputs.terminal_state }}"
