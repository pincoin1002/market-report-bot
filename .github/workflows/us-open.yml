name: 美股開盤日報

on:
  schedule:
    # 夏令時間（EDT，3月第二個週日 ~ 11月第一個週日）
    # 台北時間 21:00（週一～週五）= UTC 13:00
    - cron: "0 13 * * 1-5"
    #
    # 冬令時間（EST，11月第一個週日 ~ 3月第二個週日）
    # 台北時間 21:00 = UTC 14:00，請改為：
    # - cron: "0 14 * * 1-5"
    #
    # 夏令/冬令切換方法：
    # 夏令（3月第二個週日起）→ cron: "0 13 * * 1-5"
    # 冬令（11月第一個週日起）→ cron: "0 14 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (generate report but skip notifications)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  generate-report:
    name: Generate US Open Report
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch market snapshot
        continue-on-error: true
        run: |
          mkdir -p data
          python scripts/fetch_market_data.py us_open

      - name: Generate US Open Report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          REPORT_MODEL: ${{ vars.REPORT_MODEL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "=== DRY RUN: notifications disabled ==="
            TELEGRAM_BOT_TOKEN="" EMAIL_SMTP_SERVER="" python scripts/generate_report.py us_open
          else
            python scripts/generate_report.py us_open
          fi

      - name: Validate report prices
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPORT_MODEL: ${{ vars.REPORT_MODEL }}
        run: python scripts/validate_report.py us_open

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-open-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/us_open_*.md
          retention-days: 90
          if-no-files-found: warn

      - name: Upload data artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-open-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/market_snapshot.json
            data/report_summary.json
            data/validation_results.json
          retention-days: 30
          if-no-files-found: ignore
