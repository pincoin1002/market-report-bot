name: 台股收盤日報

on:
  repository_dispatch:
    types: [trigger-tw-close]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (generate report but skip notifications)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  generate-report:
    name: Generate Taiwan Close Report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch market snapshot
        id: fetch
        run: |
          mkdir -p data
          # set +e: the runner shell is bash -e, so a non-zero exit would kill
          # the step before EXIT_CODE=$? runs and holiday exits (2/3) would fail the job
          set +e
          python scripts/fetch_market_data.py tw_close
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -eq 2 ]; then
            echo "market_closed=true" >> $GITHUB_OUTPUT
            exit 0
          elif [ $EXIT_CODE -eq 0 ]; then
            echo "market_closed=false" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Error: fetch_market_data.py failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi

      - name: Generate Taiwan Close Report
        if: steps.fetch.outputs.market_closed != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PORTFOLIO_KEY: ${{ secrets.PORTFOLIO_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          REPORT_MODEL: ${{ vars.REPORT_MODEL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "=== DRY RUN: notifications disabled ==="
            TELEGRAM_BOT_TOKEN="" EMAIL_SMTP_SERVER="" python scripts/generate_report.py tw_close
          else
            python scripts/generate_report.py tw_close
          fi

      - name: Skip report (market closed)
        if: steps.fetch.outputs.market_closed == 'true'
        run: echo "Market closed today — report generation skipped."

      - name: Validate report prices
        if: steps.fetch.outputs.market_closed != 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPORT_MODEL: ${{ vars.REPORT_MODEL }}
        run: python scripts/validate_report.py tw_close

      - name: Prepare review package
        if: steps.fetch.outputs.market_closed != 'true'
        continue-on-error: true
        run: python scripts/prepare_review.py tw_close

      - name: Commit and push generated report
        if: steps.fetch.outputs.market_closed != 'true'
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git commit -m "chore: save generated tw_close report [skip ci]" || exit 0
          git pull --rebase
          git push

      - name: Upload review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tw-close-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/review_package_*.md
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tw-close-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/tw_close_*.md
          retention-days: 90
          if-no-files-found: warn

      - name: Upload data artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tw-close-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/market_snapshot.json
            data/report_summary.json
            data/validation_results.json
          retention-days: 30
          if-no-files-found: ignore
