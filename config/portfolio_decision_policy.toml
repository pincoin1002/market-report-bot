version = "decision-risk-v1"
weight_basis = "ACTIVE_HOLDINGS_MARKET_VALUE"
description_zh = "預設檢視上限：股票20%、廣泛ETF40%、主題ETF10%、加密幣10%、代幣2%、單一穩定幣20%。占比以全部有效持倉的最新可得報價估值為分母，未含現金與負債；這是可調整的風險檢視規則，並非PIOS已確認的配置目標。個別已驗證PIOS規則優先；逐檔列出適用來源與上限。"
